name: TACTICA.SIM Quant & API CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-engines-and-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install runtime & test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx matplotlib

      - name: Run mathematical invariant, calibration & FastAPI tests
        run: python -m pytest -v

      - name: Verify CLI calibration & xT Markov scripts execute cleanly
        run: |
          python tactica_bayes_dc_engine.py --league calcio --export-json /tmp/ci_cal.json
          python tactica_xt_engine.py --export-json /tmp/ci_xt.json
